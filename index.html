<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>a little secret</title>
<meta name="description" content="A small gift, made with love." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Ephesis&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ── twilight palette ── */
    --bg-0:#04020a;
    --bg-1:#120a20;
    --bg-2:#1d0b24;
    --rose:#ff5d8f;
    --blush:#ff9ec7;
    --gold:#ffd4a3;
    --cream:#fff0f5;
    --ink:      rgba(255,240,245,0.94);
    --ink-soft: rgba(255,240,245,0.55);
    --ink-faint:rgba(255,240,245,0.30);
    --script:'Ephesis', cursive;
    --serif:'Cormorant Garamond', Georgia, serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(120% 90% at 50% 115%, rgba(120,30,70,0.45), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:var(--serif);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── layers ── */
  #scene{ position:fixed; inset:0; z-index:0; }
  #scene canvas{ display:block; width:100%; height:100%; }

  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 120% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  .stage{
    position:fixed; inset:0; z-index:2;
    display:grid; place-items:center; text-align:center;
    padding:6vh 8vw; pointer-events:none;
  }
  /* both screens share one centered cell, so each sits dead-center */
  .stage > section{ grid-area:1 / 1; align-self:center; justify-self:center; }

  /* ── intro ── */
  .intro{
    display:flex; flex-direction:column; align-items:center; gap:2.1rem;
    pointer-events:auto;
    transition:opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease;
  }
  .intro.gone{
    opacity:0; transform:translateY(-14px) scale(.98); filter:blur(6px);
    pointer-events:none;
  }

  .eyebrow{
    margin:0; font-size:.72rem; font-weight:500;
    letter-spacing:.55em; text-transform:uppercase;
    color:var(--ink-faint); padding-left:.55em;
  }

  .key-input{
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:clamp(1.4rem, 4.5vw, 2.1rem);
    text-align:center; color:var(--cream);
    background:transparent; border:none;
    border-bottom:1px solid var(--ink-faint);
    width:min(92vw, 28rem); max-width:100%; padding:.28em .4em .22em;
    caret-color:var(--rose); letter-spacing:.01em;
    transition:border-color .5s ease, box-shadow .5s ease;
  }
  .key-input::placeholder{ color:var(--ink-faint); font-style:italic; }
  .key-input:focus{
    outline:none;
    border-bottom-color:var(--rose);
    box-shadow:0 14px 30px -22px var(--rose);
  }
  .key-input.nope{ animation:nudge .5s ease; }
  @keyframes nudge{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-9px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(4px); }
  }

  .hint-wrap{ display:flex; flex-direction:column; gap:.35rem; }
  .hint{
    margin:0; font-style:italic; font-weight:300;
    font-size:clamp(.95rem, 2.6vw, 1.15rem);
    color:var(--ink-soft); transition:color .4s ease;
  }
  .hint.flash{ color:var(--rose); }
  .cue{
    margin:0; font-size:.7rem; letter-spacing:.4em; text-transform:uppercase;
    color:var(--ink-faint); padding-left:.4em;
  }

  /* ── revealed message ── */
  .message{
    position:relative; pointer-events:none;
    opacity:0; transform:translateY(18px);
    transition:opacity 1.4s ease, transform 1.4s ease;
  }
  .message::before{
    content:""; position:absolute; left:50%; top:52%;
    width:140%; height:220%; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(10,4,16,0.55), transparent 72%);
    z-index:-1; pointer-events:none;
  }
  .message.show{ opacity:1; transform:translateY(0); }

  .m-eyebrow{
    font-size:clamp(.7rem,2vw,.82rem); letter-spacing:.5em;
    text-transform:uppercase; color:var(--gold);
    opacity:0; transform:translateY(10px);
    transition:opacity 1.4s ease .6s, transform 1.4s ease .6s;
  }
  .m-main{
    font-family:var(--script); font-weight:400;
    font-size:clamp(3.4rem, 15vw, 9rem); line-height:.95;
    color:var(--cream); margin:.12em 0 .04em;
    text-shadow:0 0 42px rgba(255,120,170,.55), 0 0 8px rgba(255,200,220,.4);
    opacity:0; transform:translateY(18px);
    transition:opacity 1.8s ease 3.2s, transform 1.8s ease 3.2s;
  }
  .m-sub{
    font-style:italic; font-weight:300;
    font-size:clamp(1.05rem, 3.4vw, 1.7rem);
    letter-spacing:.03em; color:var(--ink);
    opacity:0; transform:translateY(14px);
    transition:opacity 1.5s ease 6.2s, transform 1.5s ease 6.2s;
  }
  .message.show .m-eyebrow,
  .message.show .m-main,
  .message.show .m-sub{ opacity:1; transform:translateY(0); }

  /* ── replay ── */
  .replay{
    position:fixed; left:50%; bottom:5.2vh; transform:translateX(-50%);
    z-index:3; pointer-events:none;
    font-family:var(--serif); font-size:.74rem; font-weight:500;
    letter-spacing:.42em; text-transform:uppercase;
    color:var(--ink-faint); background:none; border:none; cursor:pointer;
    padding:.6em .4em .4em; padding-left:.82em;
    border-bottom:1px solid transparent;
    opacity:0; transition:opacity 1s ease .4s, color .4s ease, border-color .4s ease;
  }
  .replay.show{ opacity:1; pointer-events:auto; }
  .replay:hover, .replay:focus-visible{
    color:var(--ink); border-bottom-color:var(--rose); outline:none;
  }

  /* ── the poem line beside each shape ── */
  .caption{
    position:fixed; left:50%; bottom:12vh; transform:translate(-50%, 12px);
    z-index:2; pointer-events:none; width:min(88vw, 42rem); text-align:center;
    opacity:0; transition:opacity .9s ease, transform .9s ease;
  }
  .caption::before{
    content:""; position:absolute; left:50%; top:50%;
    width:160%; height:340%; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(10,4,16,0.5), transparent 72%);
    z-index:-1;
  }
  .caption span{
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:clamp(1.3rem, 3.6vw, 2rem); line-height:1.35;
    letter-spacing:.015em; color:var(--cream);
    text-shadow:0 0 26px rgba(255,150,190,.5), 0 0 6px rgba(255,210,225,.35);
  }
  .caption.show{ opacity:1; transform:translate(-50%, 0); }

  :focus-visible{ outline:2px solid var(--rose); outline-offset:4px; border-radius:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.35s !important; }
    .m-eyebrow, .m-main, .m-sub{ transition-delay:0s !important; }
    .key-input.nope{ animation:none; }
  }
</style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <section class="intro" id="intro">
      <p class="eyebrow" id="introEyebrow">a little secret</p>
      <input
        id="key"
        class="key-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="Type the magic words to reveal the surprise"
        placeholder="type the magic words…"
      />
      <div class="hint-wrap">
        <p class="hint" id="hint"></p>
        <p class="cue">press enter</p>
      </div>
    </section>

    <section class="message" id="message" aria-live="polite">
      <div class="m-eyebrow" id="mEyebrow"></div>
      <div class="m-main" id="mMain"></div>
      <div class="m-sub" id="mSub"></div>
    </section>
  </main>

  <button class="replay" id="replay" type="button">again</button>

  <div class="caption" id="caption" aria-hidden="true"><span id="captionText"></span></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

  /* ═══════════════════════════════════════════════════════════════
     ❤  YOUR SETTINGS  —  change the text in quotes to make it yours
     ═══════════════════════════════════════════════════════════════ */
  const CONFIG = {
    // Shown small & gold, just above the big message ("FOR ___")
    recipientName: "my love",

    // The big flowing script line
    messageMain:   "I love you",

    // The smaller line underneath
    messageSub:    "today, tomorrow, and always",

    // Little line on the first screen
    introEyebrow:  "a little secret",

    // The gentle hint under the input
    hint:          "psst… just tell me how you feel",
    showHint:      true,

    // Any of these phrases will unlock the surprise (lowercase)
    secretWords: [
      "i love you", "iloveyou", "i love u", "love you", "ily", "i adore you"
    ],

    // A short poem — one line appears beside each shape as it fully forms.
    // Order: sparks, galaxy, helix, ring, burst. Use "" to skip one.
    // (The final heart keeps the message above; it has no line here.)
    sceneLines: [
      "Before you, I was scattered light,",
      "you spun my world into a galaxy,",
      "two souls, forever intertwined,",
      "one ring to hold my every promise,",
      "a heart too full to hold inside —"
    ]
  };
  /* ═══════════════════════════════════════════════════════════════
     You can stop here — everything below just makes the magic. ✨
     (Colours to tweak are in the two palettes a little further down.)
     ═══════════════════════════════════════════════════════════════ */

  // ---------- fill the text in ----------
  document.getElementById('introEyebrow').textContent = CONFIG.introEyebrow;
  const hintEl = document.getElementById('hint');
  hintEl.textContent = CONFIG.showHint ? CONFIG.hint : "when you're ready…";
  document.getElementById('mMain').textContent = CONFIG.messageMain;
  document.getElementById('mSub').textContent  = CONFIG.messageSub;
  const mEyebrow = document.getElementById('mEyebrow');
  if (CONFIG.recipientName && CONFIG.recipientName.trim()){
    mEyebrow.textContent = "for " + CONFIG.recipientName.trim();
  } else {
    mEyebrow.style.display = "none";
  }
  document.title = CONFIG.recipientName ? ("for " + CONFIG.recipientName) : "a little secret";

  // ---------- small helpers ----------
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const lerp   = (a,b,t) => a + (b-a)*t;
  const smoother = x => { x = clamp01(x); return x*x*x*(x*(x*6-15)+10); };
  const rand = (a,b) => a + Math.random()*(b-a);
  const randn = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
                        return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const ramp  = (t,a,b) => smoother((t-a)/(b-a));          // 0 before a → 1 after b
  const gpulse= (t,c,w) => Math.exp(-Math.pow((t-c)/w,2)); // a soft bump centred at c
  const norm = s => s.toLowerCase().normalize('NFKD')
                     .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();

  const secretSet = new Set(CONFIG.secretWords.map(norm));
  const isSecret = v => secretSet.has(norm(v));

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LOW = window.matchMedia('(max-width: 768px)').matches ||
              (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);

  // detail counts
  const N      = LOW ? 850  : 1500;   // hearts that dance through every scene
  const EMBERS = LOW ? 200  : 500;    // ambient drifting hearts in the background
  const STARS  = LOW ? 150  : 300;    // faint background dust

  // ---------- colour palettes (deep → light) ----------
  const HEART_PALETTE = ["#ff4d84","#ff7ba6","#ffa8c4","#ffd39a","#fff2f7"];
  const EMBER_PALETTE = ["#ff5d8f","#ff8fb0","#ffc0d2","#ffd9a6","#fff0f5"];
  const toColor = (hex, jitter=0.14) => {
    const c = new THREE.Color(hex);
    c.multiplyScalar(1 + rand(-jitter, jitter));
    return c;
  };

  // ---------- renderer / scene / camera ----------
  const container = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = makeBackground();
  scene.fog = new THREE.FogExp2(new THREE.Color('#140a22'), 0.042);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
  const CAM_REST = 9, CAM_Y = 0.3;
  camera.position.set(0, CAM_Y, 10.6);
  camera.lookAt(0, 0, 0);

  function makeBackground(){
    const c = document.createElement('canvas'); c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    const lin = g.createLinearGradient(0,0,0,256);
    lin.addColorStop(0.0,'#04020a');
    lin.addColorStop(0.5,'#120a20');
    lin.addColorStop(1.0,'#1d0b24');
    g.fillStyle = lin; g.fillRect(0,0,64,256);
    const rad = g.createRadialGradient(32,205,8, 32,205,155);
    rad.addColorStop(0,'rgba(125,32,72,0.55)');
    rad.addColorStop(1,'rgba(125,32,72,0)');
    g.fillStyle = rad; g.fillRect(0,0,64,256);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // ---------- one little heart, as geometry ----------
  function makeHeartGeometry(){
    const s = new THREE.Shape();
    s.moveTo(5,5);
    s.bezierCurveTo(5,5, 4,0, 0,0);
    s.bezierCurveTo(-6,0, -6,7, -6,7);
    s.bezierCurveTo(-6,11, -3,15.4, 5,19);
    s.bezierCurveTo(12,15.4, 16,11, 16,7);
    s.bezierCurveTo(16,7, 16,0, 10,0);
    s.bezierCurveTo(7,0, 5,5, 5,5);
    const geo = new THREE.ExtrudeGeometry(s, {
      depth:2, bevelEnabled:true, bevelThickness:1.1, bevelSize:1.1,
      bevelSegments:2, steps:1, curveSegments:10
    });
    geo.rotateZ(Math.PI);   // point at the bottom
    geo.center();
    geo.scale(0.05, 0.05, 0.05);
    return geo;
  }
  const heartGeo = makeHeartGeometry();
  const baseMat = () => new THREE.MeshBasicMaterial({ color:0xffffff, fog:true, toneMapped:true });

  // ═══════════════ the scene formations (each returns N×3 positions) ═══════════════
  const g = Math.PI * (3 - Math.sqrt(5));                 // golden angle
  const fibDir = (i) => {                                 // even points on a unit sphere
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y*y));
    const th = g * i;
    return [Math.cos(th)*r, y, Math.sin(th)*r];
  };

  function fCenter(){                                     // collapsed spark at the middle
    const a = new Float32Array(N*3);
    for (let i=0;i<N;i++){ a[i*3]=randn()*0.12; a[i*3+1]=randn()*0.12; a[i*3+2]=randn()*0.12; }
    return a;
  }
  function fDust(){                                       // soft spherical cloud
    const a = new Float32Array(N*3);
    for (let i=0;i<N;i++){
      const r = 4.2*Math.cbrt(Math.random());
      let dx=randn(), dy=randn(), dz=randn();
      const m = r/Math.hypot(dx,dy,dz);
      a[i*3]=dx*m; a[i*3+1]=dy*m; a[i*3+2]=dz*m;
    }
    return a;
  }
  function fGalaxy(){                                     // 3-arm spiral in the XY plane
    const a = new Float32Array(N*3), arms=3;
    for (let i=0;i<N;i++){
      const rad = 4.4*Math.sqrt(Math.random());
      const ang = (i%arms)*(2*Math.PI/arms) + rad*0.85 + randn()*0.12;
      a[i*3]   = Math.cos(ang)*rad;
      a[i*3+1] = Math.sin(ang)*rad;
      a[i*3+2] = randn()*(0.12 + 0.16*(1 - rad/4.4));
    }
    return a;
  }
  function fHelix(){                                      // two intertwining strands
    const a = new Float32Array(N*3), H=6.2, turns=3, R=1.7;
    for (let i=0;i<N;i++){
      const t = i/(N-1);
      const ang = t*turns*2*Math.PI + (i%2)*Math.PI;
      const rr = R + randn()*0.12;
      let x=Math.cos(ang)*rr, y=(t-0.5)*H, z=Math.sin(ang)*rr;
      if (i%6===0){ x+=randn()*0.5; z+=randn()*0.5; y+=randn()*0.3; }  // surrounding dust
      a[i*3]=x; a[i*3+1]=y; a[i*3+2]=z;
    }
    return a;
  }
  function fRing(){                                       // a tilted halo (torus)
    const a = new Float32Array(N*3), R=3.3, r=0.85, tilt=0.5;
    const ct=Math.cos(tilt), st=Math.sin(tilt);
    for (let i=0;i<N;i++){
      const u=Math.random()*2*Math.PI, v=Math.random()*2*Math.PI;
      const x=(R+r*Math.cos(v))*Math.cos(u);
      const yy=(R+r*Math.cos(v))*Math.sin(u);
      const z0=r*Math.sin(v);
      a[i*3]=x; a[i*3+1]=yy*ct - z0*st; a[i*3+2]=yy*st + z0*ct;
    }
    return a;
  }
  function fBurst(){                                      // great expanding sphere shell
    const a = new Float32Array(N*3);
    for (let i=0;i<N;i++){
      const d = fibDir(i), rr = 6.5 + randn()*0.25;
      a[i*3]=d[0]*rr; a[i*3+1]=d[1]*rr; a[i*3+2]=d[2]*rr;
    }
    return a;
  }
  function fHeart(){                                      // the finale — a filled 3D heart
    const a = new Float32Array(N*3), SCALE=2.4, SHIFT=0.35;
    let n=0;
    while (n<N){
      const x = rand(-1.55,1.55), y = rand(-1.5,1.75);
      const aa = x*x + y*y - 1;
      const f  = aa*aa*aa - x*x*y*y*y;                    // <=0 → inside the heart
      if (f<=0){
        const d = Math.max(0,-f);
        const zmax = Math.pow(Math.min(d,1),0.5)*0.55 + 0.05;
        a[n*3]   = x*SCALE;
        a[n*3+1] = y*SCALE - SHIFT;
        a[n*3+2] = rand(-1,1)*zmax*SCALE*0.5;
        n++;
      }
    }
    return a;
  }

  // scene table — axis/type control how each formation slowly moves while it's on screen
  const SCENES = [
    { base:fDust(),   axis:'y', type:'spin', speed:0.15 },
    { base:fGalaxy(), axis:'z', type:'spin', speed:0.35 },
    { base:fHelix(),  axis:'y', type:'spin', speed:0.55 },
    { base:fRing(),   axis:'y', type:'spin', speed:0.45 },
    { base:fBurst(),  axis:'y', type:'spin', speed:0.25 },
    { base:fHeart(),  axis:'y', type:'sway', amp:0.30, freq:0.28 },
  ];
  const HEART = SCENES.length - 1;
  const CENTER = fCenter();

  // when each scene begins (its morph-in) and how long the morph lasts, in seconds
  const TIMING = [
    { trans:2.5, hold:3.4 },   // dust
    { trans:2.5, hold:3.4 },   // galaxy
    { trans:2.5, hold:3.8 },   // helix
    { trans:2.5, hold:3.6 },   // ring
    { trans:2.2, hold:3.2 },   // burst
    { trans:3.0, hold:9999 },  // heart (holds, then idles forever)
  ];
  const startTime = [0];
  for (let k=1;k<SCENES.length;k++) startTime[k] = startTime[k-1] + TIMING[k-1].trans + TIMING[k-1].hold;

  const sceneAngle = (k, st) => {
    const sc = SCENES[k];
    return sc.type==='sway' ? sc.amp*Math.sin(st*sc.freq) : sc.speed*st;
  };

  // ---------- the dancing hearts ----------
  const particles = new THREE.InstancedMesh(heartGeo, baseMat(), N);
  particles.frustumCulled = false;
  scene.add(particles);

  const sizes  = new Float32Array(N);
  const delays = new Float32Array(N);   // per-heart stagger so morphs flow
  const facing = new Float32Array(N);   // fixed spin so hearts don't all align
  for (let i=0;i<N;i++){
    sizes[i]  = rand(0.10, 0.19);
    delays[i] = Math.random()*0.35;
    facing[i] = rand(0, Math.PI*2);
    const r = Math.random();
    const idx = r<0.5 ? 0 : r<0.75 ? 1 : r<0.9 ? 2 : r<0.97 ? 3 : 4;
    particles.setColorAt(i, toColor(HEART_PALETTE[idx]));
  }
  particles.instanceColor.needsUpdate = true;

  // ---------- ambient drifting embers ----------
  const emberMesh = new THREE.InstancedMesh(heartGeo, baseMat(), EMBERS);
  emberMesh.frustumCulled = false;
  scene.add(emberMesh);
  const em = [];
  for (let i=0;i<EMBERS;i++){
    em.push({
      x: rand(-8,8), y: rand(-6,8), z: rand(-4.5, 2.5),
      size: rand(0.07, 0.32),
      speed: rand(0.35, 1.05),
      swayAmp: rand(0.15, 0.7), swayFreq: rand(0.3, 1.1), phase: rand(0,Math.PI*2),
      spin: rand(-0.9, 0.9), rot: rand(0, Math.PI*2)
    });
    emberMesh.setColorAt(i, toColor(EMBER_PALETTE[Math.floor(Math.random()*EMBER_PALETTE.length)]));
  }
  emberMesh.instanceColor.needsUpdate = true;

  // ---------- faint background dust ----------
  const starGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(STARS*3);
  for (let i=0;i<STARS;i++){ sp[i*3]=rand(-16,16); sp[i*3+1]=rand(-10,12); sp[i*3+2]=rand(-16,-4); }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color:0xffe6f0, size:0.045, sizeAttenuation:true,
    transparent:true, opacity:0.55, fog:false, depthWrite:false
  }));
  scene.add(stars);

  // ---------- bloom / glow ----------
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.55, LOW ? 0.7 : 0.85, 0.20
  );
  composer.addPass(bloom);

  // ---------- state ----------
  const state = { playing:false, returning:false, showTime:0, fade:0 };
  const dummy = new THREE.Object3D();
  const clock = new THREE.Clock();
  const pointer = { x:0, y:0, tx:0, ty:0 };

  window.addEventListener('pointermove', e => {
    pointer.tx = (e.clientX / window.innerWidth  - 0.5) * 2;
    pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive:true });

  // ---------- interaction ----------
  const introEl  = document.getElementById('intro');
  const messageEl= document.getElementById('message');
  const replayEl = document.getElementById('replay');
  const keyEl    = document.getElementById('key');
  const captionEl   = document.getElementById('caption');
  const captionText = document.getElementById('captionText');

  function tryUnlock(){
    if (isSecret(keyEl.value)){
      state.playing = true; state.returning = false;
      state.showTime = reduce ? (startTime[HEART] + TIMING[HEART].trans + 0.5) : 0;
      introEl.classList.add('gone');
      keyEl.blur();
    } else {
      keyEl.classList.remove('nope'); void keyEl.offsetWidth; keyEl.classList.add('nope');
      hintEl.classList.add('flash');
      setTimeout(()=>hintEl.classList.remove('flash'), 900);
    }
  }
  keyEl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); tryUnlock(); } });

  replayEl.addEventListener('click', () => {
    state.returning = true;
    messageEl.classList.remove('show');
    replayEl.classList.remove('show');
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
    bloom.setSize(window.innerWidth, window.innerHeight);
  });

  setTimeout(()=>{ try{ keyEl.focus(); }catch(e){} }, 600);

  // ---------- heartbeat (lub-dub) ----------
  function heartbeat(t, period){
    const p = (t % period) / period;
    const b1 = Math.exp(-Math.pow((p - 0.00)/0.06, 2));
    const b2 = Math.exp(-Math.pow((p - 0.20)/0.07, 2)) * 0.75;
    return b1 + b2;
  }

  let capShown = -2;   // which poem line is on screen right now

  // ---------- main loop ----------
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    // fade the whole swarm in on unlock, out on replay
    const wantFade = (state.playing && !state.returning) ? 1 : 0;
    state.fade += (wantFade - state.fade) * Math.min(1, dt*2.5);
    if (state.returning && state.fade < 0.02){
      state.returning = false; state.playing = false; state.showTime = 0;
      introEl.classList.remove('gone');
      keyEl.value = '';
      setTimeout(()=>{ try{ keyEl.focus(); }catch(e){} }, 300);
    }

    // the master show clock
    if (state.playing && !state.returning) state.showTime += dt;
    const T = state.showTime;
    const born = ramp(T, 0, 1.6);
    const fade = state.fade;

    // ── glow: rises as the hearts appear, flares at the big beats, then settles ──
    let bl = 0.55 + 0.5*born;
    if (!reduce){
      bl += 0.30*gpulse(T,8,1.6) + 0.30*gpulse(T,14,1.8)
          + 0.50*gpulse(T,26,1.8) + 0.50*gpulse(T,31,2.0);
      bl = lerp(bl, 1.05, ramp(T,36,42));
    }
    bloom.strength = Math.min(bl, 1.8);

    // ── camera: settle in, push slowly closer, recoil during the explosion ──
    pointer.x = lerp(pointer.x, pointer.tx, dt*2.2);
    pointer.y = lerp(pointer.y, pointer.ty, dt*2.2);
    const par = reduce ? 0 : 1;
    const camZ = CAM_REST
               + 1.6*(1 - ramp(T,0,3.5))
               - 0.6*ramp(T,3.5,40)
               + (reduce ? 0 : 0.15*Math.sin(T*0.13))
               + (reduce ? 0 : 1.3*gpulse(T,26,2.0));
    const camX = pointer.x*1.2*par + (reduce ? 0 : Math.sin(T*0.1)*0.5*ramp(T,3.5,20));
    camera.position.set(camX, CAM_Y - pointer.y*0.7*par, camZ);
    camera.lookAt(0, 0, 0);

    // ── figure out which scene we're in, and how far into its morph ──
    let c = 0;
    for (let k=0;k<SCENES.length;k++){ if (T >= startTime[k]) c = k; }
    const st = T - startTime[c];
    const p  = clamp01(st / TIMING[c].trans);

    const baseCur = SCENES[c].base, axC = SCENES[c].axis;
    const aC = reduce ? 0 : sceneAngle(c, st);
    const csC = Math.cos(aC), snC = Math.sin(aC);

    const hasPrev = p < 1;
    let baseP = CENTER, axP = 'y', csP = 1, snP = 0;
    if (hasPrev && c > 0){
      const pc = c - 1;
      baseP = SCENES[pc].base; axP = SCENES[pc].axis;
      const aP = reduce ? 0 : sceneAngle(pc, T - startTime[pc]);
      csP = Math.cos(aP); snP = Math.sin(aP);
    }

    // heartbeat + breath, but only once the final heart has formed
    let gscale = 1;
    if (c === HEART && !reduce){
      const hh = ramp(st, 0.6, 2.2);
      const period = lerp(1.05, 1.25, ramp(st,0,25));
      const amp = (0.05 + 0.03*gpulse(st,6,3)) * hh;
      gscale = (1 + heartbeat(t, period)*amp) * (1 + 0.04*Math.sin(st*0.2)*hh);
    }

    // ── place every heart ──
    const gsize = fade * born;
    particles.visible = fade > 0.01;
    if (particles.visible){
      for (let i=0;i<N;i++){
        const i3 = i*3;
        // current formation, rotated about its axis
        const bx=baseCur[i3], by=baseCur[i3+1], bz=baseCur[i3+2];
        let cx,cy,cz;
        if (axC==='y'){ cx=bx*csC+bz*snC; cy=by;              cz=-bx*snC+bz*csC; }
        else if (axC==='z'){ cx=bx*csC-by*snC; cy=bx*snC+by*csC; cz=bz; }
        else { cx=bx; cy=by*csC-bz*snC; cz=by*snC+bz*csC; }

        let fx,fy,fz;
        if (hasPrev){
          const px0=baseP[i3], py0=baseP[i3+1], pz0=baseP[i3+2];
          let px,py,pz;
          if (axP==='y'){ px=px0*csP+pz0*snP; py=py0;               pz=-px0*snP+pz0*csP; }
          else if (axP==='z'){ px=px0*csP-py0*snP; py=px0*snP+py0*csP; pz=pz0; }
          else { px=px0; py=py0*csP-pz0*snP; pz=py0*snP+pz0*csP; }
          let e = (p - delays[i]) / 0.65; e = e<0?0:e>1?1:e; e = e*e*e*(e*(e*6-15)+10);
          fx=px+(cx-px)*e; fy=py+(cy-py)*e; fz=pz+(cz-pz)*e;
        } else { fx=cx; fy=cy; fz=cz; }

        dummy.position.set(fx*gscale, fy*gscale, fz*gscale);
        dummy.rotation.set(0, 0, facing[i]);
        dummy.scale.setScalar(sizes[i]*gsize);
        dummy.updateMatrix();
        particles.setMatrixAt(i, dummy.matrix);
      }
      particles.instanceMatrix.needsUpdate = true;
    }

    // ── ambient embers: modest through the show, gushing into the finale ──
    let eScale = 0.28 + 0.25*born;
    let eSpeed = 0.5;
    if (!reduce){
      eSpeed += 0.9*gpulse(T,26,1.8) + 0.5*ramp(T,30,38);
      eScale += 0.35*gpulse(T,26,2.2) + 0.35*ramp(T,30,38);
    } else { eSpeed *= 0.4; }
    eScale = Math.min(eScale, 1.5);
    for (let i=0;i<EMBERS;i++){
      const e = em[i];
      e.y += e.speed * eSpeed * dt;
      e.rot += (reduce ? 0 : e.spin) * dt;
      if (e.y > 7.6){ e.y = -6.6; e.x = rand(-8,8); e.z = rand(-4.5,2.5); }
      const x = e.x + (reduce ? 0 : Math.sin(t*e.swayFreq + e.phase) * e.swayAmp);
      dummy.position.set(x, e.y, e.z);
      dummy.rotation.set(0, 0, e.rot);
      dummy.scale.setScalar(e.size * eScale);
      dummy.updateMatrix();
      emberMesh.setMatrixAt(i, dummy.matrix);
    }
    emberMesh.instanceMatrix.needsUpdate = true;

    stars.rotation.y = t * 0.01;

    // ── a line of the poem appears beside each shape once it's fully formed ──
    let capIdx = (!state.returning && c < HEART && p >= 0.999) ? c : -1;
    if (capIdx !== -1){
      const line = CONFIG.sceneLines[capIdx];
      if (!(line && line.trim())) capIdx = -1;
    }
    if (capIdx !== capShown){
      capShown = capIdx;
      if (capIdx === -1){
        captionEl.classList.remove('show');
      } else {
        captionText.textContent = CONFIG.sceneLines[capIdx];
        captionEl.classList.add('show');
      }
    }

    // ── reveal the words once the heart has formed; offer "again" a bit later ──
    const show = (c === HEART && st > 1.2 && !state.returning);
    if (show) messageEl.classList.add('show'); else messageEl.classList.remove('show');
    if (c === HEART && st > 9 && !state.returning) replayEl.classList.add('show');

    composer.render();
  }
  animate();
  </script>
</body>
</html>
